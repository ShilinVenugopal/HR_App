# Serves the built SPA with client-side routing support. API/uploads
# requests never reach this container in production — the Caddy edge
# proxy routes those straight to the backend (see repo-root Caddyfile) —
# but the /api and /uploads blocks below are kept as a safety net so this
# image is also usable standalone (e.g. `docker run` for a quick local
# check) without 404s on a hard refresh of a deep route.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets are content-hashed by Vite — safe to cache long-term.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
