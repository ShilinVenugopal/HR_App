<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1433"/>
      <stop offset="0.55" stop-color="#16285e"/>
      <stop offset="1" stop-color="#2a6bff"/>
    </linearGradient>
    <linearGradient id="tick" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#67e8f9"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <rect x="17" y="17" width="478" height="478" rx="111" fill="none" stroke="#4f8cff" stroke-opacity="0.35" stroke-width="2"/>
  <!-- the "F": stem + top arm -->
  <rect x="132" y="112" width="60" height="288" rx="16" fill="#ffffff"/>
  <rect x="132" y="112" width="248" height="60" rx="16" fill="#ffffff"/>
  <!-- middle arm drawn as a checkmark -->
  <polyline points="214,268 262,316 384,194" fill="none" stroke="url(#tick)" stroke-width="52" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
